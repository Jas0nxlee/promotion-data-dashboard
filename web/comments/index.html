<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>评论互动时间线</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="../css/maitian.css?v=20261118">
<link rel="stylesheet" href="../css/style.css?v=20261118">
<link rel="stylesheet" href="css/style.css?v=20261118">
<link rel="stylesheet" href="../css/workspace.css?v=20261118">
</head>
<body>
<a class="skip-link" href="#main-content">跳至主要内容</a>
<div class="workspace">
  <header class="workspace-toolbar">
    <a class="workspace-brand" href="../index.html" aria-label="推广数据中心首页">
      <span class="brand-mark" aria-hidden="true"><i></i><i></i><i></i></span>
      推广数据中心
    </a>
    <nav class="workspace-nav" aria-label="数据看板">
        <a href="../index.html"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="3"/><path d="m10 9 5 3-5 3z"/></svg><span>视频概览</span></a>
        <a href="../articles/index.html"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="3" width="16" height="18" rx="2"/><path d="M8 8h8M8 12h8M8 16h5"/></svg><span>图文概览</span></a>
        <a href="../comments/index.html" aria-current="page"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a8 8 0 0 1-8 8H6l-4 2 1.6-5.1A8 8 0 0 1 3 12a9 9 0 0 1 18 0Z"/><path d="M7.5 11h9M7.5 14.5h6"/></svg><span>评论互动</span></a>
    </nav>

    <div class="workspace-time"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="8"/><path d="M12 7v5l3 2"/></svg><span>本地时间</span><time id="clock">--:--:--</time></div>
  </header>
  <main id="main-content" class="workspace-main">
    <header class="workspace-heading">
      <div>
        <h1>评论互动</h1>
        <p class="page-context"><span id="subtitle">新增评论与官方回复</span><span id="sourceBadge" class="badge">数据加载中</span></p>
      </div>
      <div class="heading-actions">
        <span class="snapshot-time">快照更新于 <b id="updatedAt">--</b></span>
        <details class="jump-menu">
          <summary>本页目录</summary>
          <nav class="workspace-anchors" aria-label="本页目录">
              <a href="#kpiStrip">互动指标</a>
              <a href="#operationsSection">采集概况</a>
              <a href="#timelineSection">评论与回复</a>
          </nav>
        </details>
        <button id="exportData" class="export-data" type="button" title="导出当前筛选结果为 CSV"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v12m-5-5 5 5 5-5M4 16v4h16v-4"/></svg>导出 CSV</button>
      </div>
    </header>
    <section class="timeline-status" id="timelineStatus"></section>
    <p id="refreshStatus" class="filter-summary" role="status" aria-live="polite"></p>

    <section class="control-bar" aria-label="时间线筛选">
      <div class="control-title">时间线筛选</div>
      <div class="filters timeline-filters">
        <select id="fPlatform" aria-label="平台"><option value="all">全部平台</option></select>
        <select id="fAccount" aria-label="账号"><option value="all">全部账号</option></select>
        <select id="fStatus" aria-label="回复状态">
          <option value="all">全部状态</option>
          <option value="pending">尚未检测到官方回复</option>
          <option value="replied">已官方回复</option>
        </select>
        <select id="fPeriod" aria-label="时间范围">
          <option value="all">上线后全部</option>
          <option value="1">今日</option>
          <option value="7">近 7 天</option>
          <option value="30">近 30 天</option>
        </select>
        <input id="fSearch" type="search" placeholder="搜索作品、评论或回复…" aria-label="搜索时间线">
        <button class="reset-filters" id="resetFilters" type="button">重置</button>
      </div>
      <div class="filter-summary" id="filterSummary"></div>
    </section>

    <section class="timeline-kpis" id="kpiStrip"></section>

    <section class="grid-row timeline-overview" id="operationsSection">
      <article class="card span-4 api-card">
        <h2 class="card-title"><i class="dot dot-green"></i>今日采集操作<span class="card-note">保留操作计数，日上限可选</span></h2>
        <div id="apiBudget"></div>
      </article>
      <article class="card span-8">
        <h2 class="card-title"><i class="dot dot-violet"></i>采集操作趋势<span class="card-note">直接 HTTP 请求与浏览器操作次数</span></h2>
        <div class="chart usage-chart" id="chartUsage"></div>
      </article>
    </section>

    <section class="card timeline-card" id="timelineSection">
      <h2 class="card-title"><i class="dot dot-gold"></i>评论 → 官方回复
        <span class="card-note" id="timelineSummary">仅展示功能上线后的新增互动</span>
      </h2>
      <div class="timeline-list" id="timelineList"></div>
      <div class="pager" id="pager"></div>
    </section>

    <footer class="foot" id="provenance">
      时间口径：评论和回复时间均来自平台；只有用户 ID 与被监测账号一致的回复才计为官方回复。
    </footer>
  </main>
</div>
<script src="../lib/echarts.min.js"></script>
<script src="js/app.js?v=20261118"></script>
</body>
</html>
