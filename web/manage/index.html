<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>账号接入与验证 · 推广数据大屏</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f4f6f9;color:#18283d;font:15px/1.6 system-ui,sans-serif}main{max-width:1150px;margin:50px auto;padding:0 24px}h1{font-size:32px;margin:0 0 6px}p{color:#53667d}.top{display:flex;justify-content:space-between;align-items:center;margin:24px 0}.badge{background:#e6edf7;padding:6px 14px;border-radius:20px}table{width:100%;border-collapse:collapse;background:white;border:1px solid #dce4ee}th,td{text-align:left;padding:14px 18px;border-bottom:1px solid #e6ebf1}th{background:#eef3f9;font-weight:600}button{font:inherit;cursor:pointer;border:1px solid #b8c9dd;border-radius:6px;padding:6px 11px;background:white;color:#214b7b;margin:2px}button.primary{background:#185ec0;color:white;border-color:#185ec0}button:disabled{opacity:.5;cursor:default}.muted{font-size:12px;color:#637890}.ok{color:#187646}.pending{color:#8a5b08}#notice{min-height:32px;color:#214b7b}dialog{border:0;border-radius:12px;width:min(850px,95vw);box-shadow:0 20px 80px #0004}dialog::backdrop{background:#16284166}textarea{width:100%;min-height:340px;border:1px solid #c0cfdd;border-radius:6px;padding:15px;font:13px/1.5 monospace}.actions{text-align:right;margin-top:15px}@media(max-width:700px){main{margin:24px auto}th,td{padding:9px}th:nth-child(2),td:nth-child(2){display:none}.top{display:block}h1{font-size:25px}}
</style>
<main><h1>账号接入与验证</h1><p>先在独立浏览器登录，再验证采集范围。此页面只管理本地测试，不会启动正式采集或发送邮件。</p>
<div class="top"><span id="summary" class="badge">正在读取账号清单</span><button id="refresh">刷新状态</button></div><div id="notice" role="status"></div>
<table><thead><tr><th>账号</th><th>平台</th><th>接入状态</th><th>操作</th></tr></thead><tbody id="rows"></tbody></table>
<p class="muted">“已登录”不等于“数据完整”。内容分页、评论及回复须分别通过验证；配置更改后，旧验证结果自动失效。</p></main>
<dialog id="editor"><h2 id="editTitle">采集配置</h2><p>用于登录后的流程校准。凭证只填写环境变量名，请勿粘贴密码或 Cookie。</p><textarea id="config" aria-label="账号采集配置"></textarea><div class="actions"><button id="cancel">取消</button><button id="save" class="primary">保存配置</button></div></dialog>
<script>
const csrf="__CSRF_TOKEN__";let activeAccount="";
const labels={bilibili:"B站",douyin:"抖音",wechat_channels:"视频号",xiaohongshu:"小红书",zhihu:"知乎",wechat_service:"服务号",wechat_subscription:"订阅号"};
async function post(path,data){const r=await fetch(path,{method:"POST",headers:{"Content-Type":"application/json","X-CSRF-Token":csrf},body:JSON.stringify(data)});const x=await r.json();if(!r.ok)throw Error(x.error||"操作失败");return x}
function notice(text){document.querySelector("#notice").textContent=text}
async function action(account,what){try{if(what==="edit"){activeAccount=account;const x=await post("/api/config/read",{account});document.querySelector("#editTitle").textContent=account+" · 配置";document.querySelector("#config").value=JSON.stringify(x,null,2);document.querySelector("#editor").showModal();return}const x=await post("/api/"+what,{account});notice(x.message||"只读验证已提交");await refresh()}catch(e){notice(e.message)}}
async function refresh(){try{const r=await fetch("/api/accounts");if(!r.ok)throw Error("状态读取失败");const data=await r.json();const rows=document.querySelector("#rows");rows.replaceChildren();let ready=0;for(const a of data){const tr=document.createElement("tr");let text=a.health.ready?"验证通过":a.health.identity_verified?"内容或评论待验证":a.configured?"待登录校准":"尚未接入";if(a.job.running)text="验证中";if(a.health.ready)ready++;for(const value of [a.name,labels[a.platform]||a.platform,text]){const td=document.createElement("td");td.textContent=value;tr.append(td)}const td=document.createElement("td");for(const [name,what] of [["打开登录","login"],["只读验证","probe"],["配置","edit"]]){const button=document.createElement("button");button.textContent=name;button.disabled=!!a.job.running;button.onclick=()=>action(a.key,what);td.append(button)}tr.append(td);rows.append(tr)}document.querySelector("#summary").textContent=`${data.length} 个账号 · ${ready} 个验证通过`}catch(e){notice(e.message)}}
document.querySelector("#refresh").onclick=refresh;document.querySelector("#cancel").onclick=()=>document.querySelector("#editor").close();document.querySelector("#save").onclick=async()=>{try{await post("/api/config/save",{account:activeAccount,settings:JSON.parse(document.querySelector("#config").value)});document.querySelector("#editor").close();notice("已保存。请重新验证以确认生效。");refresh()}catch(e){notice(e.message)}};refresh();setInterval(refresh,8000);
</script></html>
